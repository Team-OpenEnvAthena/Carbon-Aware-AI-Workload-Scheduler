name: carbon-scheduler
version: 1.0.0
description: >
  Carbon-Aware AI Workload Scheduler — an RL environment where an LLM agent
  schedules AI training jobs across 6 global data centres to minimise carbon
  emissions (gCO2) while meeting SLA deadlines. Carbon intensity is simulated
  from real Electricity Map regional profiles (Oregon hydro, California solar,
  Ireland wind, Singapore gas, Mumbai coal+solar, Virginia gas+nuclear).

author: hackathon-team
license: MIT
themes:
  - sustainability
  - world-modeling
  - long-horizon-planning

environment:
  type: text
  action_space: json_text
  observation_space: text_prompt
  max_steps: 24
  reward_range: [-1.0, 1.0]

server:
  entrypoint: app.py
  port: 7860
  framework: fastapi

endpoints:
  reset: POST /reset
  step:  POST /step
  state: GET  /state
  close: POST /close
  info:  GET  /info

curriculum:
  levels: 3
  level_1: "3 jobs, 2 regions, no urgent — agent learns basic carbon-aware routing"
  level_2: "6 jobs, 4 regions, some urgent — agent learns priority handling"
  level_3: "14 jobs, 6 regions, full 24h — agent learns temporal optimisation"

datasets_used:
  - name: Electricity Map carbon intensity profiles
    url: https://app.electricitymaps.com
    usage: Calibrate regional carbon intensity curves (embedded, no API call needed)
  - name: eGRID (EPA)
    url: https://www.epa.gov/egrid
    usage: Validate US regional carbon intensity values
  - name: IEA Renewables 2024
    url: https://www.iea.org/data-and-statistics/data-product/renewables-2024-dataset
    usage: Regional renewable percentage baselines

reward_components:
  carbon_score:      "0.40 — gCO2 saved vs naive run-immediately baseline"
  sla_score:         "0.30 — fraction of jobs meeting deadlines"
  deferral_quality:  "0.15 — did agent defer the right (low-priority) jobs?"
  grid_stability:    "0.15 — no region overloaded beyond capacity"
  urgency_penalty:   "bonus negative — heavy penalty for deferring URGENT jobs"
  invalid_action:    "bonus negative — malformed JSON or invalid region references"

anti_hacking:
  - "Multiple independent reward components block single-signal exploitation"
  - "URGENT jobs failing = large unavoidable penalty"
  - "Capacity constraints enforce real-world limits"
  - "Parse errors penalised — cannot game by outputting nothing"
  - "Naive baseline is worst-case, not zero — agent cannot win by doing less"

requirements:
  - fastapi
  - uvicorn
  - pydantic
