[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-aware-scheduler-env"
version = "1.0.0"
description = "Carbon-Aware AI Workload Scheduler OpenEnv environment"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

# CRITICAL: tells uv NOT to try building/installing this repo as a Python
# package. It is a runnable app, not a library. Without this, uv sync
# --no-editable fails because it can't find the installable package source.
[tool.uv]
package = false